name: Sync Upstream

on:
  schedule:
    - cron: "0 0 * * 1" # 每周一 UTC 00:00 运行
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/amir1376/ab-download-manager-browser-integration.git || git remote set-url upstream https://github.com/amir1376/ab-download-manager-browser-integration.git
          git fetch upstream

      - name: Rebase onto upstream/master
        run: |
          git rebase upstream/master

      - name: Push to origin
        run: |
          git push --force-with-lease origin HEAD:master
